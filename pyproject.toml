[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-contributor-agent"
version = "0.2.0"
description = "Autonomous OSS contributor agent: triages issues, verifies patches in an isolated sandbox, and prepares draft PRs for human review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kentaro Mori" }]
# Stdlib-first by design: HTTP and SQLite use the standard library.
# PyYAML is the one runtime dependency, for the configs/*.yaml files.
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
