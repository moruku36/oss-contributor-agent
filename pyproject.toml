[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-contributor-agent"
version = "0.1.0"
description = "Autonomous OSS contributor agent: triages issues, verifies patches in an isolated sandbox, and prepares draft PRs for human review."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kentaro Mori" }]
# Stdlib-first by design: no hard runtime dependencies yet.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
