name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Smoke-test the CLI stubs (dry-run)
        run: |
          python scripts/run_agent.py --repo example/example --issue 1 --dry-run
          python scripts/watch_repos.py --dry-run
