name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      # One invocation, exactly three cases. No matrix, retries or legacy suite.
      # Engine lifecycle wire trial: local3 + PR3 + future owner-approved main3 = 9/10.
      # No full-suite, duplicate push/PR jobs or automatic re-runs.
      # Prior lifecycle, CoderLoop, snapshot, staging and staged-attempt trials remain sealed.
      # The 10-case cap includes all local/CI/re-runs; no automatic budget reset.
      - name: Engine lifecycle wire adapter (three cases)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
        run: |
          python -m pytest -q -o addopts= \
            tests/test_docker_engine_lifecycle.py::test_security_payload_and_confirmed_lifecycle \
            tests/test_docker_engine_lifecycle.py::test_unknown_create_cleanup_and_foreign_ownership_are_single_use \
            tests/test_docker_engine_lifecycle.py::test_policy_drift_unconfirmed_delete_and_input_rejections
