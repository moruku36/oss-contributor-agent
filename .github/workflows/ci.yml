name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      # One invocation, exactly three cases. No matrix, retries or legacy suite.
      # The owner trial cap is 10 case executions across local/CI/re-runs.
      - name: Sandbox lifecycle contract (three mock-only cases)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
        run: |
          python -m pytest -q -o addopts= \
            tests/test_sandbox_lifecycle.py::test_normal_lifecycle_and_resource_policy \
            tests/test_sandbox_lifecycle.py::test_failure_cleanup_is_terminal_and_preserves_uncertainty \
            tests/test_sandbox_lifecycle.py::test_validation_and_no_dispatch_boundaries
