name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      # One invocation, exactly three cases. No matrix, retries or legacy suite.
      # New CoderLoop trial: local3 + PR3 + main3 = planned 9/10, not yet run.
      # Prior sandbox lifecycle trial is immutable at 9/10; never re-run it here.
      # The 10-case cap includes all local/CI/re-runs; no automatic budget reset.
      - name: Injected CoderLoop contract (three mock-only cases)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
        run: |
          python -m pytest -q -o addopts= \
            tests/test_coder_loop_state_machine.py::test_complete_lifecycle_verifies_entire_suite_and_cleanup \
            tests/test_coder_loop_state_machine.py::test_reproduction_and_environment_reject_without_model_patch \
            tests/test_coder_loop_state_machine.py::test_bounded_retry_feedback_and_unknown_or_excess_usage_stop
