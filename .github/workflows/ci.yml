name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      # New report trial only: exactly 3 cases per invocation.
      # Budget: planned local3 + PR3 + future owner-approved main3 = 9/10.
      # Local execution is currently blocked before dispatch (actual 0).
      # Do not publish to CI as a workaround for that unresolved denial.
      # Older lifecycle/staging trials remain sealed. No matrix or retries.
      - name: Local review report (three synthetic cases)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
        run: |
          python -m pytest -q -o addopts= \
            tests/test_review_report.py::test_success_snapshot_and_truthful_disclosure \
            tests/test_review_report.py::test_failed_unknown_and_invalid_evidence \
            tests/test_review_report.py::test_hostile_markdown_is_literal_and_no_side_effects
