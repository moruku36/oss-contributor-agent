name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      # One invocation, exactly three cases. No matrix, retries or legacy suite.
      # Snapshot trial: local3 verified; PR3 + eventual main3 -> planned 9/10 total.
      # Prior lifecycle and CoderLoop trials are each sealed at 9/10.
      # The 10-case cap includes all local/CI/re-runs; no automatic budget reset.
      - name: In-memory snapshot workspace (three synthetic cases)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
        run: |
          python -m pytest -q -o addopts= \
            tests/test_snapshot_workspace.py::test_multifile_edit_read_search_diff_and_atomic_rejection \
            tests/test_snapshot_workspace.py::test_path_protected_unsupported_entry_and_size_boundaries_preserve_snapshot \
            tests/test_snapshot_workspace.py::test_real_coder_loop_and_sandbox_share_snapshot_with_trusted_synthetic_runner
