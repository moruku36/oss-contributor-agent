name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      # One invocation, exactly three cases. No matrix, retries or legacy suite.
      # Filesystem staging trial: planned local3 + PR3 + future main3 = 9/10.
      # Coordinator verified local3 once; PR3 and future main3 remain budgeted.
      # Prior lifecycle, CoderLoop and snapshot trials are each sealed at 9/10.
      # The 10-case cap includes all local/CI/re-runs; no automatic budget reset.
      - name: Filesystem import and staging (three cases)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
        run: |
          python -m pytest -q -o addopts= \
            tests/test_filesystem_staging.py::test_import_patch_and_verified_stage_preserve_source_and_caller_fds \
            tests/test_filesystem_staging.py::test_rejections_do_not_create_stages_or_write_outside_roots \
            tests/test_filesystem_staging.py::test_partial_failure_receipt_is_terminal_and_releases_descriptors
