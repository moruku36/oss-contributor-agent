name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      # One invocation, exactly three cases. No matrix, retries or legacy suite.
      # Runner bridge trial: local3 + PR3 + future main3 = 9/10.
      # Coordinator verified local3 once; PR3 and future main3 remain budgeted.
      # Prior lifecycle, CoderLoop, snapshot and staging trials remain sealed.
      # The 10-case cap includes all local/CI/re-runs; no automatic budget reset.
      - name: Staged runner bridge (three cases)
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          PYTEST_ADDOPTS: ""
        run: |
          python -m pytest -q -o addopts= \
            tests/test_staged_runner_bridge.py::test_each_command_hands_off_a_fresh_generation_of_the_current_snapshot \
            tests/test_staged_runner_bridge.py::test_stale_replayed_or_mismatched_evidence_is_never_assessed \
            tests/test_staged_runner_bridge.py::test_partial_or_unknown_dispatch_is_terminal_and_owns_only_its_descriptor
