# Target repositories for the Autonomous OSS Contributor Agent.
#
# Every target starts with `enabled: false`. A human reviews the project's
# CONTRIBUTING.md, CLA/DCO requirements and community norms, fills in the
# to-verify fields, and only then flips `enabled` to true.
#
# `mode` separates collection from action:
#   collect-only — the collector may poll issues and triage them, but
#                  patch attempts and PR creation are impossible for
#                  this target, regardless of any other setting.
#   full         — patch/PR paths allowed (still draft-only and behind
#                  the human approval gate in agent_rules.yaml).
# A target with no `mode` is treated as collect-only (fail-closed).
# Moving a target to `full` is a human decision made only after the
# to-verify fields below have been confirmed against the project's own
# documentation.
#
# Phase 1 state: the three initial targets are enabled for COLLECTION
# ONLY. Their build/test/CLA/DCO fields are still unverified, which is
# fine for collection (nothing executes them) and remains a hard stop
# for any later phase.
#
# Commands below are best-known defaults and are marked to-verify: they must
# be confirmed against each project's own documentation before the first run.

targets:
  - repo: mattermost/mattermost
    enabled: true
    mode: collect-only
    languages: [go, typescript, react]
    watch_labels:
      - good first issue
      - help wanted
      - bug
      - documentation
    # To verify against CONTRIBUTING.md / Makefile before enabling.
    build_command: "make build"            # to-verify
    test_command: "make test"              # to-verify
    lint_command: "golangci-lint run"      # to-verify (Go side)
    format_command: ""                     # to-verify (per sub-project)
    default_branch: master                 # to-verify
    branch_prefix: "oss-agent/"
    commit_convention: conventional-commits # to-verify
    dco_required: check CONTRIBUTING.md
    cla_required: check CONTRIBUTING.md
    pr_template: check .github/PULL_REQUEST_TEMPLATE.md
    notes: >
      Large monorepo (server + webapp). Start with documentation and
      small server-side issues only. CLA/DCO specifics must be confirmed
      by a human before enabling.

  - repo: grafana/grafana
    enabled: true
    mode: collect-only
    languages: [go, typescript]
    watch_labels:
      - good first issue
      - help wanted
      - bug
      - documentation
    # To verify against CONTRIBUTING.md / Makefile before enabling.
    build_command: "make build"            # to-verify
    test_command: "go test ./..."          # to-verify (scope per package)
    lint_command: "make lint-go"           # to-verify
    format_command: ""                     # to-verify (gofmt / prettier)
    default_branch: main                   # to-verify
    branch_prefix: "oss-agent/"
    commit_convention: conventional-commits # to-verify
    dco_required: check CONTRIBUTING.md
    cla_required: check CONTRIBUTING.md
    pr_template: check .github/PULL_REQUEST_TEMPLATE.md
    notes: >
      Very large, fast-moving repository. Restrict early attempts to
      documentation and narrowly scoped backend packages. CLA/DCO
      specifics must be confirmed by a human before enabling.

  - repo: prometheus/prometheus
    enabled: true
    mode: collect-only
    languages: [go]
    watch_labels:
      - good first issue
      - help wanted
      - bug
      - documentation
    # To verify against CONTRIBUTING.md / Makefile before enabling.
    build_command: "make build"            # to-verify
    test_command: "make test"              # to-verify
    lint_command: "make lint"              # to-verify (golangci-lint)
    format_command: "gofmt -l ."           # to-verify
    default_branch: main                   # to-verify
    branch_prefix: "oss-agent/"
    commit_convention: conventional-commits # to-verify
    dco_required: check CONTRIBUTING.md    # Prometheus is known to use DCO sign-off; confirm wording
    cla_required: check CONTRIBUTING.md
    pr_template: check .github/PULL_REQUEST_TEMPLATE.md
    notes: >
      Single-language (Go) repository with a well-defined Makefile.
      Good first target once the pipeline reaches Phase 3. DCO sign-off
      wording must be confirmed by a human before enabling.

  - repo: brave/brave-browser
    enabled: true
    mode: collect-only
    languages: [cpp, javascript, typescript]
    watch_labels:
      - good first issue
      - help wanted
    # To verify against CONTRIBUTING.md / Makefile before enabling.
    build_command: ""                      # to-verify (code lives in brave/brave-core, Chromium build)
    test_command: ""                       # to-verify
    lint_command: ""                       # to-verify
    format_command: ""                     # to-verify
    default_branch: master                 # to-verify
    branch_prefix: "oss-agent/"
    commit_convention: conventional-commits # to-verify
    dco_required: check CONTRIBUTING.md
    cla_required: check CONTRIBUTING.md
    pr_template: check .github/PULL_REQUEST_TEMPLATE.md
    notes: >
      Added 2026-11-01 by owner instruction. Brave's issue tracker lives
      in this repo (11,241 open issues; good first issue 47 and
      help wanted 39 open as of 2026-11-01), while the code lives in
      brave/brave-core (Chromium checkout; full builds are far too heavy
      for the current machines, so any later phase is limited to
      JS/TS or non-build work unless a build machine exists).
      brave-core CONTRIBUTING.md (read 2026-11-01): AI-assisted
      contributions are allowed, but the human contributor must
      understand the change, build/test it manually and include the
      evidence in the PR, be transparent about AI involvement, and
      must not bulk-submit (new contributors start with 1-2 PRs).

  - repo: openclaw/openclaw
    enabled: true
    mode: collect-only
    languages: [typescript]
    watch_labels:
      - good first issue
    # To verify against CONTRIBUTING.md / Makefile before enabling.
    build_command: "pnpm install --frozen-lockfile" # from CONTRIBUTING.md (source deps)
    test_command: "pnpm test"              # to-verify (focused runs per CONTRIBUTING.md)
    lint_command: ""                       # to-verify
    format_command: ""                     # to-verify
    default_branch: main                   # to-verify
    branch_prefix: "oss-agent/"
    commit_convention: conventional-commits # to-verify
    dco_required: check CONTRIBUTING.md
    cla_required: check CONTRIBUTING.md (no CLA found in CONTRIBUTING.md as of 2026-11-01)
    pr_template: check .github/PULL_REQUEST_TEMPLATE.md
    notes: >
      Added 2026-11-01 by owner instruction (owner uses OpenClaw daily).
      CONTRIBUTING.md (read 2026-11-01) has an explicit section
      "AI/Vibe-Coded PRs Welcome": no AI disclosure label required,
      but the PR must include an Evidence section, the author must
      confirm they understand the code, and agent-authored work should
      start from an issue. Hard cap of 20 open PRs per author.
      Refactor-only and test/CI-only PRs are not accepted.
      Label counts as of 2026-11-01: good first issue 1 open,
      help wanted 0, bug 664 open. The bug label was included at first
      and produced 200+ candidates in the initial drain, so the owner
      narrowed watch_labels to good first issue only the same day
      (2026-11-01). Issues already in the ledger keep their outcomes
      but are no longer re-listed. Source work needs Node 24.22.1+
      (midorun has Node 22; collection is unaffected).
